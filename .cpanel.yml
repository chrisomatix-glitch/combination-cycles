---
deployment:
  tasks:
    # Copies only what a browser needs. The test suites, docs/, data/, the
    # catalogue generator and .git all stay out of the web root.
    #
    # src/cycles.js must be deployed because app/*.js imports it via
    # ../src/cycles.js, so the directory structure has to be preserved.
    #
    # app/ is copied wholesale (not by filename) so a new module deploys
    # automatically — a by-name list has broken production three times
    # already when a new file (notation.js, register.js, catalogueCache.js)
    # shipped in a commit without a matching edit here. If a deployable file
    # is ever added outside app/ or src/, it must still be added explicitly.
    - export DEPLOYPATH=/home/chrisgzg/public_html/cycles
    - /bin/mkdir -p $DEPLOYPATH/src
    - /bin/cp index.html $DEPLOYPATH/
    - /bin/cp src/cycles.js $DEPLOYPATH/src/
    - /bin/cp -r app $DEPLOYPATH/
    - /bin/rm -f $DEPLOYPATH/app/*.test.js
