name: tests

# Runs the engine, UI and reachability test suites in GitHub's cloud on
# every push, so the enumeration and the interface's coverage of it can be
# verified without a local Node installation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run engine test suite
        run: npm test

      - name: Run UI regression suite
        run: npm run test:ui

      - name: Run reachability suite
        run: npm run test:reachability

      - name: Run figure suite
        run: npm run test:figure

      - name: Run dials suite
        run: npm run test:dials

      - name: Run register suite
        run: npm run test:register

      - name: Run notation suite
        run: npm run test:notation

      - name: Check the catalogue matches the engine
        run: |
          npm run catalogue
          if ! git diff --quiet data/; then
            echo "::error::data/ is out of date. Run 'npm run catalogue' and commit the result."
            git diff --stat data/
            exit 1
          fi
          echo "Catalogue is up to date."
